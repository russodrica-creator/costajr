<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal Costa Júnior</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <a class="brand" href="#/inicio" aria-label="Portal Costa Júnior — início">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-text"><b>costa</b><em>junior</em></span>
      <span class="brand-sub">Portal</span>
    </a>
    <div class="topbar-right">
      <span class="mode-chip" id="modeChip"></span>
      <button class="btn btn-ghost btn-sm" id="refreshBtn" title="Recarregar dados">↻ Atualizar</button>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" hidden>Sair</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Menu do portal">
      <a href="#/inicio" data-route="inicio">Início</a>
      <p class="nav-group">Novos Negócios</p>
      <a href="#/nn/painel" data-route="nn/painel">Painel</a>
      <a href="#/nn/funil" data-route="nn/funil">Funil de compradores</a>
      <a href="#/nn/leads" data-route="nn/leads">Interessados</a>
      <a href="#/nn/terrenos" data-route="nn/terrenos">Terrenos</a>
      <a href="#/nn/mensagens" data-route="nn/mensagens">Mensagens prontas</a>
      <p class="nav-group">Dados</p>
      <a href="#/nn/dados" data-route="nn/dados">Backup e exportação</a>
    </nav>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <form method="dialog" class="modal-inner" id="modalForm" novalidate>
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
